<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResuMatch - History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        footer {
            margin-top: auto;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-white transition duration-300">

    <!-- NAVBAR -->
    <header class="bg-white dark:bg-gray-800 shadow-md py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <a href="/ResuMatch/Home_page/index.html"><img src="/ResuMatch/Home_page/logo resumatch.jpg"
                        alt="ResuMatch Logo" class="w-250 h-10" /></a>
            </div>
            <nav class="flex items-center space-x-6 text-sm font-semibold">
                <a href="/ResuMatch/registration/login.html" id="loginBtn" class="hover:text-indigo-600">Login</a>
                <a href="/ResuMatch/registration/signup.html" id="signupBtn" class="hover:text-indigo-600">Signup</a>
                <span class="block px-4 py-2 font-semibold text-blue-700" id="welcomeText"></span>
                <div id="profileDropdown" class="relative">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile Icon"
                        class="w-8 h-8 rounded-full cursor-pointer" onclick="toggleProfileMenu()">
                    <div id="dropdownMenu" class="absolute right-0 mt-2 w-40 bg-white shadow-md rounded-md hidden z-50">
                        <a href="#" onclick="openModal()"
                            class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600">Profile Settings</a>
                        <button onclick="logoutUser()"
                            class="w-full text-left px-4 py-2 hover:bg-gray-100">Logout</button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-blue-700">Resume History</h1>
            <div class="relative">
                <button id="filterBtn"
                    class="flex items-center bg-white border border-gray-300 rounded px-4 py-2 shadow-sm hover:bg-blue-50 transition">
                    <i class="fas fa-filter mr-2 text-blue-600"></i> Filter
                </button>
                <div id="filterDropdown" class="absolute right-0 mt-2 w-40 bg-white shadow-lg rounded-md hidden z-50">
                    <button class="w-full text-left px-4 py-2 hover:bg-gray-100"
                        onclick="filterHistory('newest')">Newest First</button>
                    <button class="w-full text-left px-4 py-2 hover:bg-gray-100"
                        onclick="filterHistory('oldest')">Oldest First</button>
                </div>
            </div>
        </div>

        <div id="historyContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Resume cards go here -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-100 dark:bg-gray-600 py-6">
        <div
            class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center text-sm text-gray-600 dark:text-gray-300">
            <p class="mb-4 md:mb-0">&copy; 2025 ResuMatch. All rights reserved.</p>
            <p>
                Designed & Developed by
                <a href="https://www.linkedin.com/in/rida-dange-273100256/" target="_blank"
                    class="font-semibold italic text-black hover:underline">Rida Dange</a>
            </p>
            <div class="space-x-6">
                <a href="/ResuMatch/Privacy&Terms/privacy.html" class="hover:text-indigo-600">Privacy</a>
                <a href="/ResuMatch/Privacy&Terms/terms.html" class="hover:text-indigo-600">Terms</a>
                <a href="/ResuMatch/Contact_page/contact.html" class="hover:text-indigo-600">Contact</a>
            </div>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="history.js"></script>
</body>

</html>
