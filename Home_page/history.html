<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Resume History</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">ResuMatch</h1>
        <p class="text-gray-600">Welcome, <span class="font-semibold">Username</span></p>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 p-6">
        <h2 class="text-2xl font-semibold mb-4">Your Resume History</h2>

        <div id="resumeList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Resume Card -->
            <div class="bg-white rounded-xl shadow-md p-4 relative group">
                <div onclick="openPreview('resume1.pdf')" class="cursor-pointer hover:opacity-80">
                    <embed src="resume1.pdf" class="w-full h-48 object-contain rounded" />
                </div>
                <div class="flex justify-between items-center mt-4">
                    <div class="flex gap-2">
                        <button onclick="editResume()"
                            class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 text-sm">Edit</button>
                        <button onclick="deleteResume(this)"
                            class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 text-sm">Delete</button>
                    </div>
                    <button onclick="downloadResume('resume1.pdf')" title="Download">
                        <svg class="w-6 h-6 text-gray-600 hover:text-black transition" fill="none" stroke="currentColor"
                            stroke-width="2" viewBox="0 0 24 24">
                            <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 12v6m0 0l-3-3m3 3l3-3M12 4v8" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div id="deleteModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-50">
            <div class="bg-white p-6 rounded-xl w-96 shadow-xl text-center">
                <h3 class="text-xl font-semibold text-red-600 mb-2">Delete Resume?</h3>
                <p class="text-gray-700 mb-4">Are you sure you want to delete this resume? This action cannot be undone.
                </p>
                <div class="flex justify-center gap-4">
                    <button onclick="confirmDelete()"
                        class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">
                        Yes, Delete
                    </button>
                    <button onclick="closeDeleteModal()"
                        class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400 transition">
                        Cancel
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white text-center text-sm py-3 mt-auto border-t">
        &copy; 2025 ResuMatch. All rights reserved.
    </footer>

    <!-- Preview Popup -->
    <div id="previewModal" class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-4 w-11/12 md:w-3/4 h-[90%] relative">
            <button onclick="closePreview()"
                class="absolute top-3 right-3 text-red-500 hover:text-red-700 text-2xl">&times;</button>
            <iframe id="previewFrame" class="w-full h-full" frameborder="0"></iframe>
        </div>
    </div>
    <script src="/ResuMatch/Home_page/history.js"></script>

</body>

</html>
